name: msasoup CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/whatsapp-delivery-gateway]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run offline unit tests with coverage
        run: coverage run --source=. --omit='*/tests/*,*/test_*.py' -m unittest discover -s tests -v
      - name: Coverage summary and reports
        if: always()
        run: |
          if [ -f .coverage ]; then
            coverage report -m
            coverage xml -o coverage.xml
            coverage html -d htmlcov
          else
            echo 'Coverage data not generated.'
          fi
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: htmlcov/
          retention-days: 14
          if-no-files-found: ignore
