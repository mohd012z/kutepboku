name: MSASoup APK Research Menu (manual offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_apk_research_menu.py' -v
      - run: python -m unittest discover -s tests -p 'test_apk_research_router.py' -v
      - run: python -m py_compile apk_research_menu.py bot_router.py main.py tests/test_apk_research_menu.py tests/test_apk_research_router.py
