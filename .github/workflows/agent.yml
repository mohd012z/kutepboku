name: Ebook Scout Agent & Maintenance
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Custom licensed ebook search query'
        required: false
        default: 'python programming'
        type: string
permissions:
  contents: write
concurrency:
  group: msasoup-daily
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Search and deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCOUT_QUERY: ${{ inputs.search_query || vars.SCOUT_QUERY || 'python programming' }}
        run: python agent.py
      # The scheduled scout does not operate the persistent polling database.
      # Backup and recovery must run on the host owning that database.
      - name: Persist history
        run: |
          if [ -f state/history.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/history.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(state): record delivered books'
              git push
            fi
          fi
