name: msasoup daily delivery
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: msasoup-daily
  cancel-in-progress: false
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Search and deliver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCOUT_QUERY: ${{ vars.SCOUT_QUERY || 'python programming' }}
        run: python agent.py
      # This hook backs up only files present on THIS runner.
      # Persistent bot_sessions.db must be backed up on its actual host.
      # cloud_backup.py is not yet committed; opt-in is disabled by default.
      - name: Optional runner-scoped backup
        if: ${{ vars.ENABLE_RUNNER_BACKUP == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BACKUP_CHANNEL_ID: ${{ secrets.TELEGRAM_BACKUP_CHANNEL_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          test -f cloud_backup.py || { echo 'cloud_backup.py is not implemented'; exit 1; }
          test -n "$BACKUP_ENCRYPTION_KEY" || { echo 'Backup encryption key missing'; exit 1; }
          python cloud_backup.py
      - name: Persist history
        run: |
          if [ -f state/history.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/history.json
            if ! git diff --cached --quiet; then
              git commit -m 'chore(state): record delivered books'
              git push
            fi
          fi
